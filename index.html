<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin999 夥伴計算機</title>

    <style>
        :root {
            --red: #b71934;
            --red-dark: #771022;
            --gold: #ffd84f;
            --gold-dark: #c98216;
            --cream: #fff1c4;
            --text: #4b210e;
            --shadow: 0 14px 34px rgba(0, 0, 0, 0.32);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 50% 8%, rgba(255, 255, 255, 0.32), transparent 28%),
                linear-gradient(180deg, #b9979c 0%, #efd8c8 34%, #f9e4a3 62%, #9b1730 100%);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 20% 35%, rgba(78, 172, 103, 0.32), transparent 20%),
                radial-gradient(ellipse at 84% 38%, rgba(69, 152, 97, 0.28), transparent 18%),
                radial-gradient(ellipse at bottom, rgba(255, 210, 38, 0.35), transparent 36%);
            z-index: -1;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            width: min(520px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: 18px 12px 24px;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 4px;
        }

        .language-switcher {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 2px 0 10px;
        }

        .lang-btn {
            border: 0;
            border-radius: 999px;
            padding: 7px 12px;
            color: #743916;
            font-size: 13px;
            font-weight: 950;
            background: rgba(255, 249, 223, 0.92);
            box-shadow: inset 0 -3px 0 rgba(91, 45, 12, 0.16);
        }

        .lang-btn.active {
            color: white;
            background: linear-gradient(180deg, #67d7ff, #1679d8);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
        }

        .back-btn {
            width: 54px;
            height: 54px;
            border: 4px solid #fff1cc;
            border-radius: 14px;
            color: white;
            font-size: 28px;
            font-weight: 950;
            background: linear-gradient(180deg, #d85f25, #a62c16);
            box-shadow: var(--shadow);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        }

        .title {
            text-align: center;
            margin: 4px 0 14px;
            color: var(--gold);
            font-size: 34px;
            font-weight: 950;
            letter-spacing: 1px;
            text-shadow:
                0 3px 0 #8e2c19,
                0 7px 14px rgba(0, 0, 0, 0.34);
        }

        .settings-card,
        .summary,
        .calc-panel {
            background: rgba(255, 241, 196, 0.95);
            border: 4px solid var(--gold);
            box-shadow: var(--shadow);
        }

        .settings-card {
            margin-bottom: 16px;
            padding: 14px;
            border-radius: 20px;
        }

        .settings-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: 950;
            color: #73340f;
        }

        .mode-tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .mode-btn {
            border: 0;
            border-radius: 999px;
            padding: 10px 8px;
            color: #743916;
            font-size: 14px;
            font-weight: 950;
            background: #fff9df;
            box-shadow: inset 0 -3px 0 rgba(91, 45, 12, 0.16);
        }

        .mode-btn.active {
            color: white;
            background: linear-gradient(180deg, #7aec57, #1aa63b);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
        }

        .mode-btn.gold.active {
            background: linear-gradient(180deg, #ffe871, #d58b13);
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .field {
            display: grid;
            gap: 5px;
        }

        label {
            color: #71380f;
            font-size: 13px;
            font-weight: 950;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e1a53c;
            border-radius: 12px;
            background: #fffdf0;
            color: #44200d;
            font-size: 16px;
            font-weight: 950;
            outline: none;
        }

        input:focus {
            border-color: #30b54a;
            box-shadow: 0 0 0 4px rgba(48, 181, 74, 0.18);
        }

        .team-stage {
            min-height: 310px;
            padding: 24px 4px 8px;
            border-radius: 28px;
            background:
                radial-gradient(ellipse at center bottom, rgba(255, 218, 77, 0.4), transparent 58%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
        }

        .team-row {
            display: grid;
            gap: 8px;
            align-items: end;
        }

        .team-row.normal {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .team-row.gold {
            width: min(310px, 100%);
            margin: 0 auto;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 26px;
        }

        .member-card {
            min-height: 248px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            border: 0;
            background: transparent;
            padding: 0;
            transition: 0.18s ease;
        }

        .member-card:hover {
            transform: translateY(-4px);
        }

        .member-name {
            position: absolute;
            top: 0;
            z-index: 3;
            max-width: 92px;
            padding: 4px 9px;
            border-radius: 999px;
            color: white;
            font-size: 14px;
            font-weight: 950;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .avatar {
            position: absolute;
            top: 26px;
            width: 70px;
            height: 82px;
            padding: 4px;
            border-radius: 18px;
            background: linear-gradient(180deg, #ffe075, #cf1d3d);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.28);
            z-index: 2;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            border-radius: 13px;
            color: white;
            font-size: 31px;
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.5), transparent 28%),
                linear-gradient(135deg, #456c8b, #15233d);
        }

        .creature {
            width: 105px;
            height: 125px;
            position: relative;
            filter: drop-shadow(0 8px 5px rgba(0, 0, 0, 0.24));
        }

        .creature.gold-creature {
            filter:
                drop-shadow(0 0 13px rgba(255, 218, 69, 0.72)) drop-shadow(0 8px 5px rgba(0, 0, 0, 0.25));
        }

        .creature::before {
            content: "";
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 0;
            height: 18px;
            border-radius: 50%;
            background: rgba(54, 35, 19, 0.28);
        }

        .head {
            position: absolute;
            left: 17px;
            top: 31px;
            width: 70px;
            height: 70px;
            border-radius: 48% 48% 42% 42%;
            border: 3px solid #229c47;
            background:
                radial-gradient(circle at 31% 38%, #fff 0 7px, #3a250d 8px 12px, transparent 13px),
                radial-gradient(circle at 68% 38%, #fff 0 7px, #3a250d 8px 12px, transparent 13px),
                linear-gradient(180deg, #b8f45e, #58c946);
        }

        .gold-creature .head {
            border-color: #b97511;
            background:
                radial-gradient(circle at 31% 38%, #fff 0 7px, #3a250d 8px 12px, transparent 13px),
                radial-gradient(circle at 68% 38%, #fff 0 7px, #3a250d 8px 12px, transparent 13px),
                linear-gradient(180deg, #ffe977, #e5a017);
        }

        .head::before,
        .head::after {
            content: "";
            position: absolute;
            top: -10px;
            width: 29px;
            height: 33px;
            border-radius: 60% 40% 60% 40%;
            background: linear-gradient(180deg, #9b3df0, #36bee5);
            z-index: -1;
        }

        .head::before {
            left: -10px;
            transform: rotate(-28deg);
        }

        .head::after {
            right: -10px;
            transform: rotate(28deg);
        }

        .crest {
            position: absolute;
            left: 40px;
            top: 5px;
            width: 26px;
            height: 43px;
            border-radius: 50% 50% 20% 20%;
            background: linear-gradient(180deg, #58d9e9, #7c3ee8);
            z-index: 1;
        }

        .gold-creature .crest {
            background: linear-gradient(180deg, #fff2a0, #ff9d1d);
        }

        .body {
            position: absolute;
            left: 32px;
            top: 86px;
            width: 45px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(180deg, #7ee552, #31a94a);
            border: 3px solid #218d45;
        }

        .gold-creature .body {
            background: linear-gradient(180deg, #ffe878, #d89218);
            border-color: #a96a10;
        }

        .tail {
            position: absolute;
            left: 0;
            top: 92px;
            width: 61px;
            height: 26px;
            border: 6px solid #218d45;
            border-top: 0;
            border-right: 0;
            border-radius: 0 0 0 80%;
            transform: rotate(-12deg);
        }

        .gold-creature .tail {
            border-color: #a96a10;
        }

        /* =========================
   耕種植物造型
   ========================= */

        .plant-creature {
            width: 105px;
            height: 125px;
            position: relative;
            filter: drop-shadow(0 8px 5px rgba(0, 0, 0, 0.24));
        }

        .plant-creature.gold-creature {
            filter:
                drop-shadow(0 0 14px rgba(255, 218, 69, 0.78)) drop-shadow(0 8px 5px rgba(0, 0, 0, 0.25));
        }

        .plant-creature::before {
            content: "";
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 0;
            height: 18px;
            border-radius: 50%;
            background: rgba(54, 35, 19, 0.28);
        }

        /* 土壤盆 / 土堆 */
        .plant-creature .soil {
            position: absolute;
            left: 18px;
            bottom: 4px;
            width: 70px;
            height: 32px;
            border-radius: 12px 12px 24px 24px;
            background:
                radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.2), transparent 24%),
                linear-gradient(180deg, #9a5425, #5d2b12);
            border: 3px solid #3f1c0c;
            z-index: 2;
        }

        .plant-creature.gold-creature .soil {
            background:
                radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.32), transparent 24%),
                linear-gradient(180deg, #d78b24, #7d4312);
            border-color: #5a2d0a;
        }

        /* 莖 */
        .plant-creature .stem {
            position: absolute;
            left: 50px;
            bottom: 28px;
            width: 10px;
            height: 66px;
            border-radius: 999px;
            background: linear-gradient(180deg, #7ff06a, #209d3f);
            border: 2px solid #167a31;
            z-index: 3;
        }

        .plant-creature.gold-creature .stem {
            background: linear-gradient(180deg, #fff076, #d39218);
            border-color: #9e6410;
        }

        /* 左葉 */
        .plant-creature .leaf-left {
            position: absolute;
            left: 17px;
            top: 48px;
            width: 48px;
            height: 34px;
            border-radius: 70% 20% 70% 20%;
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.45), transparent 22%),
                linear-gradient(135deg, #b9f765, #24b447);
            border: 3px solid #1d8d3d;
            transform: rotate(-24deg);
            z-index: 4;
        }

        .plant-creature.gold-creature .leaf-left {
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.55), transparent 22%),
                linear-gradient(135deg, #fff497, #d99a19);
            border-color: #a96a10;
        }

        /* 右葉 */
        .plant-creature .leaf-right {
            position: absolute;
            right: 15px;
            top: 42px;
            width: 50px;
            height: 36px;
            border-radius: 20% 70% 20% 70%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.45), transparent 22%),
                linear-gradient(225deg, #b9f765, #22ad43);
            border: 3px solid #1d8d3d;
            transform: rotate(25deg);
            z-index: 4;
        }

        .plant-creature.gold-creature .leaf-right {
            background:
                radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.55), transparent 22%),
                linear-gradient(225deg, #fff497, #d99a19);
            border-color: #a96a10;
        }

        /* 頂部花苞 / 果實 */
        .plant-creature .bud {
            position: absolute;
            left: 34px;
            top: 12px;
            width: 42px;
            height: 42px;
            border-radius: 50% 50% 45% 45%;
            background:
                radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.7), transparent 20%),
                radial-gradient(circle at 35% 48%, #fff 0 4px, #3a250d 5px 8px, transparent 9px),
                radial-gradient(circle at 65% 48%, #fff 0 4px, #3a250d 5px 8px, transparent 9px),
                linear-gradient(180deg, #ff91c8, #ef3d7f);
            border: 3px solid #b71958;
            z-index: 5;
        }

        .plant-creature.gold-creature .bud {
            background:
                radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.72), transparent 20%),
                radial-gradient(circle at 35% 48%, #fff 0 4px, #3a250d 5px 8px, transparent 9px),
                radial-gradient(circle at 65% 48%, #fff 0 4px, #3a250d 5px 8px, transparent 9px),
                linear-gradient(180deg, #fff39b, #e7a016);
            border-color: #b97511;
        }

        /* 花瓣 */
        .plant-creature .petal {
            position: absolute;
            width: 26px;
            height: 34px;
            border-radius: 50% 50% 35% 35%;
            background: linear-gradient(180deg, #ffcfec, #ff5aa6);
            border: 2px solid #c51d68;
            z-index: 4;
        }

        .plant-creature.gold-creature .petal {
            background: linear-gradient(180deg, #fff8b8, #ffc029);
            border-color: #b97511;
        }

        .plant-creature .petal.p1 {
            left: 42px;
            top: 0;
        }

        .plant-creature .petal.p2 {
            left: 22px;
            top: 14px;
            transform: rotate(-42deg);
        }

        .plant-creature .petal.p3 {
            right: 20px;
            top: 14px;
            transform: rotate(42deg);
        }

        /* 小臉嘴巴 */
        .plant-creature .bud::after {
            content: "";
            position: absolute;
            left: 15px;
            top: 27px;
            width: 12px;
            height: 6px;
            border-bottom: 3px solid #7b1c34;
            border-radius: 0 0 999px 999px;
        }

        .progress-wrap {
            width: 86px;
            height: 15px;
            margin-top: 4px;
            padding: 2px;
            border-radius: 999px;
            background: #743315;
            box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        /* 分段進度條容器 */
        .progress-stack {
            width: 100%;
            height: 100%;
            display: flex;
            border-radius: 999px;
            overflow: hidden;
        }

        /* 自己的進度：藍色 */
        .progress-self {
            height: 100%;
            background: linear-gradient(180deg, #67d7ff, #1679d8);
        }

        /* 隊友的進度：綠色 */
        .progress-friend {
            height: 100%;
            background: linear-gradient(180deg, #8dfb5c, #19b735);
        }

        /* 黃金關卡時，隊友進度改成金色 */
        .progress-friend.gold-progress {
            background: linear-gradient(180deg, #fff174, #d99a18);
        }

        /* 進度滿出時的補強，避免圓角破掉 */
        .progress-self:first-child,
        .progress-friend:first-child {
            border-top-left-radius: 999px;
            border-bottom-left-radius: 999px;
        }

        .progress-self:last-child,
        .progress-friend:last-child {
            border-top-right-radius: 999px;
            border-bottom-right-radius: 999px;
        }

        .summary {
            margin-top: 12px;
            padding: 14px;
            border-radius: 18px;
            border-width: 3px;
        }

        .summary-grid,
        .calc-result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .summary-item,
        .calc-card {
            padding: 10px 8px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.58);
            text-align: center;
        }

        .summary-label,
        .calc-card strong {
            display: block;
            margin-bottom: 4px;
            color: #7a461d;
            font-size: 12px;
            font-weight: 950;
        }

        .summary-value,
        .calc-card span {
            color: #481f0b;
            font-size: 17px;
            font-weight: 950;
        }

        .clear-btn {
            width: 100%;
            margin-top: 12px;
            border: 0;
            border-radius: 14px;
            padding: 12px;
            color: white;
            font-size: 15px;
            font-weight: 950;
            background: linear-gradient(180deg, #e76256, #b93429);
        }

        footer {
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.92);
            text-align: center;
            font-size: 13px;
            font-weight: 850;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.28);
        }

        .detail-page {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            overflow-y: auto;
            background:
                radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.32), transparent 28%),
                linear-gradient(180deg, #b9979c 0%, #efd8c8 36%, #f7e19a 60%, #940f2b 100%);
        }

        .detail-page.open {
            display: block;
        }

        .detail-inner {
            width: min(520px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: 18px 12px 24px;
        }

        .gold-header {
            position: relative;
            margin: 6px auto 20px;
            width: min(360px, 100%);
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gold-title-board {
            flex: 1;
            height: 84px;
            margin: 0 -4px;
            display: grid;
            place-items: center;
            color: var(--gold);
            font-size: 25px;
            font-weight: 950;
            background: linear-gradient(180deg, #c51d3c, #7e1027);
            border: 5px solid var(--gold);
            box-shadow: var(--shadow);
            text-shadow: 0 3px 0 #81210e;
            text-align: center;
        }

        .duel-card {
            width: 94px;
            min-height: 120px;
            z-index: 2;
            padding: 5px;
            border-radius: 18px;
            background: linear-gradient(180deg, #ffdc58, #b81935);
            box-shadow: var(--shadow);
            color: white;
            text-align: center;
        }

        .duel-name {
            font-size: 14px;
            font-weight: 950;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        }

        .duel-avatar {
            height: 62px;
            margin: 2px 0 5px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            font-size: 31px;
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.48), transparent 28%),
                linear-gradient(135deg, #4e7792, #17243a);
            border: 2px solid #fff2a6;
        }

        .duel-score {
            padding: 4px;
            border-radius: 999px;
            background: rgba(90, 9, 28, 0.85);
            font-size: 13px;
            font-weight: 950;
        }

        .creature-stage {
            display: grid;
            place-items: center;
            min-height: 245px;
            margin-bottom: 10px;
        }

        .big-creature {
            transform: scale(1.85);
        }

        .need-line {
            margin: 0 auto 12px;
            width: fit-content;
            max-width: 100%;
            padding: 8px 16px;
            border-radius: 999px;
            color: var(--gold);
            font-size: 18px;
            font-weight: 950;
            background: linear-gradient(180deg, #bd1837, #780d22);
            border: 3px solid var(--gold);
            text-align: center;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.28);
            box-shadow: var(--shadow);
        }

        .level-bar-box {
            padding: 12px;
            border-radius: 20px;
            background: linear-gradient(180deg, #bd1737, #7c0e25);
            border: 4px solid var(--gold);
            box-shadow: var(--shadow);
        }

        .level-row {
            display: grid;
            grid-template-columns: 84px 1fr;
            gap: 10px;
            align-items: center;
        }

        .level-badge {
            padding: 9px 6px;
            border-radius: 14px;
            color: #7b310f;
            text-align: center;
            font-size: 14px;
            font-weight: 950;
            background: linear-gradient(180deg, #fff174, #ffbb24);
        }

        .level-progress {
            height: 28px;
            padding: 3px;
            border-radius: 999px;
            background: #65101d;
            overflow: hidden;
        }

        .level-progress-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(180deg, #54ef62, #11a634);
            width: 0%;
        }

        .stage-table {
            margin-top: 12px;
            padding: 12px;
            border-radius: 18px;
            background: rgba(255, 241, 196, 0.96);
            border: 3px solid var(--gold);
            box-shadow: var(--shadow);
        }

        .stage-table-title {
            margin-bottom: 8px;
            font-weight: 950;
            color: #73340f;
            text-align: center;
        }

</head>

<body>

    <script>
        const STORAGE_KEY = "coin999_partner_calc_v6";
        const DEFAULT_LANG = "zh-TW";
        const SUPPORTED_LANGS = ["zh-TW", "vi", "en"];

        let i18n = {};

        const RATES = {
            hatch: {
                tokens: 14500,
                score: 170000
            },
            farm: {
                tokens: 7500,

        const STAGE_TABLES = {
            hatch: [

                255000,
                340000
            ],

            goldHatch: [

                560000,
                830000,
                1150000,
                1500000,
                1900000
            ],

            farm: [
                5000,
                15000,
                35000,
                60000,
                105000,
                180000
            ],

            goldFarm: [
                10000,
                40000,
                120000,
                220000,
                370000,
                570000,
                820000,
                1120000
            ]
        };

        const MODES = {
            hatch: {
                rateType: "hatch",
                targetKey: "hatch",
                count: 4,
                isGold: false,
                stageKey: "hatch"
            },
            farm: {
                rateType: "farm",
                targetKey: "farm",
                count: 4,
                isGold: false,
                stageKey: "farm"
            },
            goldHatch: {
                rateType: "hatch",
                targetKey: "goldHatch",
                count: 2,
                isGold: true,
                stageKey: "goldHatch"
            },
            goldFarm: {
                rateType: "farm",
                targetKey: "goldFarm",
                count: 2,
                isGold: true,
                stageKey: "goldFarm"
            }
        };

        const DEFAULT_DATA = {
            mode: "hatch",
            lang: DEFAULT_LANG,
            self: {
                name: "",
                score: 0
            },
            targets: {
                hatch: 340000,
                farm: 180000,
                goldHatch: 1900000,
                goldFarm: 1120000
            },
            members: {
                hatch: [
                    { id: "hatch-1", name: "", nameType: "normal", nameNumber: 1, selfScore: 0, score: 0, avatar: "😍" },
                    { id: "hatch-2", name: "", nameType: "normal", nameNumber: 2, selfScore: 0, score: 0, avatar: "🥰" },
                    { id: "hatch-3", name: "", nameType: "normal", nameNumber: 3, selfScore: 0, score: 0, avatar: "😘" },
                    { id: "hatch-4", name: "", nameType: "normal", nameNumber: 4, selfScore: 0, score: 0, avatar: "🤩" }
                ],
                farm: [
                    { id: "farm-1", name: "", nameType: "normal", nameNumber: 1, selfScore: 0, score: 0, avatar: "😍" },
                    { id: "farm-2", name: "", nameType: "normal", nameNumber: 2, selfScore: 0, score: 0, avatar: "🥰" },
                    { id: "farm-3", name: "", nameType: "normal", nameNumber: 3, selfScore: 0, score: 0, avatar: "😘" },
                    { id: "farm-4", name: "", nameType: "normal", nameNumber: 4, selfScore: 0, score: 0, avatar: "🤩" }
                ],
                goldHatch: [
                    { id: "goldHatch-1", name: "", nameType: "gold", nameNumber: 1, selfScore: 0, score: 0, avatar: "👑" },
                    { id: "goldHatch-2", name: "", nameType: "gold", nameNumber: 2, selfScore: 0, score: 0, avatar: "🏆" }
                ],
                goldFarm: [
                    { id: "goldFarm-1", name: "", nameType: "gold", nameNumber: 1, selfScore: 0, score: 0, avatar: "👑" },
                    { id: "goldFarm-2", name: "", nameType: "gold", nameNumber: 2, selfScore: 0, score: 0, avatar: "🏆" }
                ]
            }
        };

        let appData = loadData();
        let editingMemberId = null;
        let saveTimer = null;
        let isI18nReady = false;

        const els = {
            pageTitle: document.getElementById("pageTitle"),
            saveStatus: document.getElementById("saveStatus"),
            modeButtons: document.querySelectorAll(".mode-btn"),
            langButtons: document.querySelectorAll(".lang-btn"),

            hatchTarget: document.getElementById("hatchTarget"),
            farmTarget: document.getElementById("farmTarget"),
            goldHatchTarget: document.getElementById("goldHatchTarget"),
            goldFarmTarget: document.getElementById("goldFarmTarget"),

            teamRow: document.getElementById("teamRow"),
            teamTarget: document.getElementById("teamTarget"),
            teamProgress: document.getElementById("teamProgress"),
            clearAllBtn: document.getElementById("clearAllBtn"),

            detailPage: document.getElementById("detailPage"),
            detailBackBtn: document.getElementById("detailBackBtn"),
            closeDetailBtn: document.getElementById("closeDetailBtn"),

            detailTitle: document.getElementById("detailTitle"),
            detailCreatureStage: document.getElementById("detailCreatureStage"),

            selfNameView: document.getElementById("selfNameView"),
            selfScoreView: document.getElementById("selfScoreView"),
            friendNameView: document.getElementById("friendNameView"),
            friendAvatarView: document.getElementById("friendAvatarView"),
            friendScoreView: document.getElementById("friendScoreView"),

            selfNameInput: document.getElementById("selfNameInput"),
            selfScoreInput: document.getElementById("selfScoreInput"),
            friendNameInput: document.getElementById("friendNameInput"),
            friendScoreInput: document.getElementById("friendScoreInput"),

            needLine: document.getElementById("needLine"),
            levelText: document.getElementById("levelText"),
            detailProgressBar: document.getElementById("detailProgressBar"),

            stageTableBox: document.getElementById("stageTableBox"),
            stageTableTitle: document.getElementById("stageTableTitle"),
            stageGrid: document.getElementById("stageGrid"),

            detailTotalScore: document.getElementById("detailTotalScore"),
            detailTargetScore: document.getElementById("detailTargetScore"),
            detailRemainingScore: document.getElementById("detailRemainingScore"),
            detailNeedTokens: document.getElementById("detailNeedTokens"),
            detailNextStage: document.getElementById("detailNextStage"),
            detailNextStageRemaining: document.getElementById("detailNextStageRemaining")
        };

        function clone(data) {
            return JSON.parse(JSON.stringify(data));
        }

        function numberValue(value, fallback = 0) {
            const num = Number(value);
            return Number.isFinite(num) && num >= 0 ? num : fallback;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function getLang() {
            return SUPPORTED_LANGS.includes(appData.lang) ? appData.lang : DEFAULT_LANG;
        }

        function getLocale() {
            const lang = getLang();

            if (lang === "vi") {
                return "vi-VN";
            }

            if (lang === "en") {
                return "en-US";
            }

            return "zh-TW";
        }

        function formatNumber(num) {
            return Math.ceil(num).toLocaleString(getLocale());
        }

        function getByPath(obj, path) {
            return path.split(".").reduce((current, key) => {
                return current && current[key] !== undefined ? current[key] : undefined;
            }, obj);
        }

        function t(path, params = {}) {
            let text = getByPath(i18n, path);

            if (text === undefined || text === null) {
                text = path;
            }

            text = String(text);

            Object.keys(params).forEach((key) => {
                text = text.replaceAll(`{${key}}`, params[key]);
            });

            return text;
        }

        function getDefaultMemberName(member) {
            const type = member.nameType || "normal";
            const number = member.nameNumber || 1;

            return t(`memberDefault.${type}`, {
                n: number
            });
        }

        function getMemberDisplayName(member) {
            const customName = String(member.name || "").trim();

            if (customName) {
                return customName;
            }

            return getDefaultMemberName(member);
        }

        async function loadLanguage(lang) {
            const safeLang = SUPPORTED_LANGS.includes(lang) ? lang : DEFAULT_LANG;

            try {
                const response = await fetch(`./i18n/${safeLang}.json`, {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`Cannot load language: ${safeLang}`);
                }

                i18n = await response.json();
                appData.lang = safeLang;
                isI18nReady = true;
            } catch (error) {
                console.error(error);

                if (safeLang !== DEFAULT_LANG) {
                    await loadLanguage(DEFAULT_LANG);
                    return;
                }

                i18n = {};
                isI18nReady = true;
            }
        }

        function applyI18n() {
            if (!isI18nReady) {
                return;
            }

            document.documentElement.lang = getLang();
            document.title = t("app.documentTitle");

            document.querySelectorAll("[data-i18n]").forEach((node) => {
                const key = node.dataset.i18n;
                node.textContent = t(key);
            });

            els.langButtons.forEach((button) => {
                button.classList.toggle("active", button.dataset.lang === getLang());
            });

            if (!saveTimer) {
                els.saveStatus.textContent = t("settings.saveLocal");
            }
        }

        async function setLanguage(lang) {
            if (!SUPPORTED_LANGS.includes(lang)) {
                return;
            }

            const member = findEditingMember();

            await loadLanguage(lang);
            applyI18n();

            if (member && !member.name) {
                els.friendNameInput.value = getDefaultMemberName(member);
            }

            render();
            saveData();
        }

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);

                if (!saved) {
                    return clone(DEFAULT_DATA);
                }

                const parsed = JSON.parse(saved);
                const defaults = clone(DEFAULT_DATA);

                return {
                    ...defaults,
                    ...parsed,
                    lang: SUPPORTED_LANGS.includes(parsed.lang) ? parsed.lang : DEFAULT_LANG,
                    self: {
                        ...defaults.self,
                        ...(parsed.self || {})
                    },
                    targets: {
                        ...defaults.targets,
                        ...(parsed.targets || {})
                    },
                    members: mergeMembers(parsed.members)
                };
            } catch {
                return clone(DEFAULT_DATA);
            }
        }

        function isLegacyDefaultMemberName(name, member) {
            const value = String(name || "").trim();

            if (!value) {
                return true;
            }

            const number = member.nameNumber || 1;
            const type = member.nameType || "normal";

            const legacyNames = type === "gold"
                ? [
                    `黃金隊友${number}`,
                    `Gold Partner ${number}`,
                    `Đồng đội vàng ${number}`
                ]
                : [
                    `隊友${number}`,
                    `Partner ${number}`,
                    `Đồng đội ${number}`
                ];

            return legacyNames.includes(value);
        }

        function normalizeMemberName(savedName, member) {
            if (isLegacyDefaultMemberName(savedName, member)) {
                return "";
            }

            return String(savedName || "").trim();
        }

        function mergeMembers(savedMembers) {
            const defaults = clone(DEFAULT_DATA.members);
            const result = {};

            Object.keys(defaults).forEach((mode) => {
                const savedList = savedMembers && Array.isArray(savedMembers[mode])
                    ? savedMembers[mode]
                    : [];

                result[mode] = defaults[mode].map((member) => {
                    const saved = savedList.find((item) => item.id === member.id);

                    return saved
                        ? {
                            ...member,
                            ...saved,

                            /**
                             * 重點：
                             * 如果舊資料是「隊友1、隊友2、黃金隊友1」這類預設名稱，
                             * 就清成空字串，讓畫面改用 i18n 動態顯示。
                             *
                             * 如果使用者真的自訂名稱，例如「小明」「Anna」，
                             * 則會保留下來。
                             */
                            name: normalizeMemberName(saved.name, member),

                            nameType: member.nameType,
                            nameNumber: member.nameNumber,

                            selfScore: numberValue(saved.selfScore, member.selfScore || 0),
                            score: numberValue(saved.score, member.score || 0)
                        }
                        : member;
                });
            });

            return result;
        }

        function saveData() {
            clearTimeout(saveTimer);

            saveTimer = setTimeout(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
                saveTimer = null;
                showSaved();
            }, 250);
        }

        function saveDataNow() {
            clearTimeout(saveTimer);
            saveTimer = null;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            showSaved();
        }

        function showSaved() {
            els.saveStatus.textContent = t("settings.saved");

            clearTimeout(showSaved.timer);
            showSaved.timer = setTimeout(() => {
                els.saveStatus.textContent = t("settings.saveLocal");
            }, 900);
        }

        function getModeConfig() {
            return MODES[appData.mode] || MODES.hatch;
        }

        function isFarmMode() {
            const config = getModeConfig();
            return config.rateType === "farm";
        }

        function getCurrentMembers() {
            return appData.members[appData.mode] || [];
        }

        function getCurrentTarget() {
            const config = getModeConfig();

            return numberValue(
                appData.targets[config.targetKey],
                DEFAULT_DATA.targets[config.targetKey]
            );
        }

        function getScorePerToken() {
            const config = getModeConfig();
            const rate = RATES[config.rateType];

            return rate.score / rate.tokens;
        }

        function getStageData(score) {
            const config = getModeConfig();
            const stages = config.stageKey ? STAGE_TABLES[config.stageKey] : null;

            if (!stages || !Array.isArray(stages) || stages.length === 0) {
                const target = getCurrentTarget();
                const progress = target > 0 ? Math.min(score / target, 1) : 0;
                const pseudoStage = Math.min(9, Math.floor(progress * 9));
                const nextRemaining = Math.max(target - score, 0);

                return {
                    hasStages: false,
                    stages: [],
                    currentStage: pseudoStage,
                    totalStages: 9,
                    nextStage: pseudoStage >= 9 ? null : pseudoStage + 1,
                    nextRemaining,
                    completedStageCount: pseudoStage
                };
            }

            let completedStageCount = 0;
            let nextStage = null;
            let nextStageTarget = 0;

            for (let i = 0; i < stages.length; i++) {
                const stageTarget = stages[i];

                if (score >= stageTarget) {
                    completedStageCount = i + 1;
                } else {
                    nextStage = i + 1;
                    nextStageTarget = stageTarget;
                    break;
                }
            }

            const nextRemaining = nextStage
                ? Math.max(nextStageTarget - score, 0)
                : 0;

            return {
                hasStages: true,
                stages,
                currentStage: completedStageCount,
                totalStages: stages.length,
                nextStage,
                nextRemaining,
                completedStageCount
            };
        }

        function getMemberProgressParts(member) {
            const target = getCurrentTarget();
            const selfScore = numberValue(member.selfScore, 0);
            const friendScore = numberValue(member.score, 0);

            if (target <= 0) {
                return {
                    selfPercent: 0,
                    friendPercent: 0
                };
            }

            const totalScore = selfScore + friendScore;

            if (totalScore <= target) {
                return {
                    selfPercent: (selfScore / target) * 100,
                    friendPercent: (friendScore / target) * 100
                };
            }

            return {
                selfPercent: (selfScore / totalScore) * 100,
                friendPercent: (friendScore / totalScore) * 100
            };
        }

        function render() {
            if (!isI18nReady) {
                return;
            }

            applyI18n();
            renderInputs();
            renderMode();
            renderMembers();
            renderSummary();

            if (editingMemberId) {
                updateDetailCalc();
            }
        }

        function renderInputs() {
            els.hatchTarget.value = appData.targets.hatch;
            els.farmTarget.value = appData.targets.farm;
            els.goldHatchTarget.value = appData.targets.goldHatch;
            els.goldFarmTarget.value = appData.targets.goldFarm;
        }

        function renderMode() {
            const config = getModeConfig();

            els.pageTitle.textContent = t(`pageTitle.${appData.mode}`);

            els.modeButtons.forEach((button) => {
                button.classList.toggle("active", button.dataset.mode === appData.mode);
            });

            els.teamRow.className = config.isGold
                ? "team-row gold"
                : "team-row normal";
        }

        function getCreatureHtml(config, extraClass = "") {
            const goldClass = config.isGold ? "gold-creature" : "";
            const className = `${isFarmMode() ? "plant-creature" : "creature"} ${extraClass} ${goldClass}`.trim();

            if (isFarmMode()) {
                return `
                <div class="${className}">
                    <div class="petal p1"></div>
                    <div class="petal p2"></div>
                    <div class="petal p3"></div>
                    <div class="bud"></div>
                    <div class="leaf-left"></div>
                    <div class="leaf-right"></div>
                    <div class="stem"></div>
                    <div class="soil"></div>
                </div>
            `;
            }

            return `
            <div class="${className}">
                <div class="crest"></div>
                <div class="head"></div>
                <div class="body"></div>
                <div class="tail"></div>
            </div>
        `;
        }

        function renderMembers() {
            const config = getModeConfig();
            const members = getCurrentMembers();

            els.teamRow.innerHTML = "";

            members.forEach((member) => {
                const progressParts = getMemberProgressParts(member);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "member-card";

                button.innerHTML = `
                <div class="member-name">${escapeHtml(getMemberDisplayName(member))}</div>

                <div class="avatar">
                    <div class="avatar-inner">${escapeHtml(member.avatar || "🧑")}</div>
                </div>

                ${getCreatureHtml(config)}

                <div class="progress-wrap" title="${escapeHtml(config.isGold ? t("progressBar.goldTitle") : t("progressBar.normalTitle"))}">
                    <div class="progress-stack">
                        <div class="progress-self" style="width:${progressParts.selfPercent}%"></div>
                        <div class="progress-friend ${config.isGold ? "gold-progress" : ""}" style="width:${progressParts.friendPercent}%"></div>
                    </div>
                </div>
            `;

                button.addEventListener("click", () => openDetail(member.id));

                els.teamRow.appendChild(button);
            });
        }

        function renderSummary() {
            const members = getCurrentMembers();
            const target = getCurrentTarget();
            const totalTarget = target * members.length;

            const totalScore = members.reduce((sum, member) => {
                return sum
                    + numberValue(member.selfScore, 0)
                    + numberValue(member.score, 0);
            }, 0);

            const progress = totalTarget > 0
                ? Math.min((totalScore / totalTarget) * 100, 100)
                : 0;

            els.teamTarget.textContent = formatNumber(totalTarget);
            els.teamProgress.textContent = `${progress.toFixed(1)}${t("unit.percent")}`;
        }

        function findEditingMember() {
            return getCurrentMembers().find((member) => member.id === editingMemberId);
        }

        function openDetail(memberId) {
            editingMemberId = memberId;

            const member = findEditingMember();

            if (!member) {
                return;
            }

            els.selfNameInput.value = appData.self.name || t("person.selfDefault");
            els.selfScoreInput.value = member.selfScore || 0;
            els.friendNameInput.value = member.name || getDefaultMemberName(member);
            els.friendScoreInput.value = member.score || 0;

            updateDetailCalc();
            els.detailPage.classList.add("open");
        }

        function closeDetail() {
            if (editingMemberId) {
                autoSaveDetail();
                saveDataNow();
            }

            editingMemberId = null;
            els.detailPage.classList.remove("open");
        }

        function updateDetailCalc() {
            const config = getModeConfig();
            const member = findEditingMember();

            if (!member) {
                return;
            }

            const selfName = els.selfNameInput.value.trim() || t("person.selfDefault");
            const selfScore = numberValue(els.selfScoreInput.value, 0);
            const friendName = els.friendNameInput.value.trim() || getDefaultMemberName(member);
            const friendScore = numberValue(els.friendScoreInput.value, 0);

            const target = getCurrentTarget();
            const totalScore = selfScore + friendScore;
            const remaining = Math.max(target - totalScore, 0);
            const progress = target > 0 ? Math.min((totalScore / target) * 100, 100) : 0;

            const scorePerToken = getScorePerToken();
            const needTokens = remaining / scorePerToken;

            const stageData = getStageData(totalScore);

            els.detailTitle.textContent = t(`detailTitle.${appData.mode}`);
            els.detailCreatureStage.innerHTML = getCreatureHtml(config, "big-creature");

            els.selfNameView.textContent = selfName;
            els.selfScoreView.textContent = formatNumber(selfScore);

            els.friendNameView.textContent = friendName;
            els.friendAvatarView.textContent = member.avatar || "🧑";
            els.friendScoreView.textContent = formatNumber(friendScore);

            els.needLine.textContent = remaining > 0
                ? t("message.needLine", { score: formatNumber(remaining) })
                : t("message.completedCanUpgrade");

            els.levelText.textContent = t("stage.levelText", {
                current: stageData.currentStage,
                total: stageData.totalStages
            });

            els.detailProgressBar.style.width = `${progress}%`;

            els.detailTotalScore.textContent = formatNumber(totalScore);
            els.detailTargetScore.textContent = formatNumber(target);
            els.detailRemainingScore.textContent = formatNumber(remaining);
            els.detailNeedTokens.textContent = formatNumber(needTokens);

            els.detailNextStage.textContent = stageData.nextStage
                ? t("stage.nth", { n: stageData.nextStage })
                : t("stage.completed");

            els.detailNextStageRemaining.textContent = formatNumber(stageData.nextRemaining);

            renderStageTable(stageData, totalScore);
        }

        function renderStageTable(stageData, totalScore) {
            if (!stageData.hasStages) {
                els.stageTableBox.style.display = "none";
                els.stageGrid.innerHTML = "";
                return;
            }

            els.stageTableBox.style.display = "block";
            els.stageTableTitle.textContent = t("stage.tableTitle", {
                mode: t(`modeName.${appData.mode}`),
                count: stageData.totalStages
            });

            els.stageGrid.innerHTML = stageData.stages.map((stageTarget, index) => {
                const previousTarget = index === 0 ? 0 : stageData.stages[index - 1];
                const stageScore = stageTarget - previousTarget;

                let className = "stage-cell";

                if (totalScore >= stageTarget) {
                    className += " done";
                } else if (stageData.nextStage === index + 1) {
                    className += " current";
                }

                return `
                <div class="${className}">
                    ${escapeHtml(t("stage.nth", { n: index + 1 }))}<br>
                    ${formatNumber(stageScore)}<br>
                    <small>${escapeHtml(t("stage.cumulative", { score: formatNumber(stageTarget) }))}</small>
                </div>
            `;
            }).join("");
        }

        function autoSaveDetail() {
            const member = findEditingMember();

            if (!member) {
                return;
            }

            const inputSelfName = els.selfNameInput.value.trim();
            const inputFriendName = els.friendNameInput.value.trim();
            const defaultFriendName = getDefaultMemberName(member);

            appData.self.name = inputSelfName || t("person.selfDefault");
            member.selfScore = numberValue(els.selfScoreInput.value, 0);

            /**
             * 重點：
             * 如果輸入框內容等於目前語言的預設名稱，
             * 就不要存成自訂名稱。
             *
             * 這樣切語言時才會自動變成 Partner 1 / Đồng đội 1。
             */
            member.name = inputFriendName === defaultFriendName
                ? ""
                : inputFriendName;

            member.score = numberValue(els.friendScoreInput.value, 0);

            updateDetailCalc();
            renderMembers();
            renderSummary();
            saveData();
        }

        function updateTarget(key, input, defaultValue) {
            appData.targets[key] = Math.max(1, numberValue(input.value, defaultValue));

            renderMode();
            renderMembers();
            renderSummary();
            updateDetailCalc();
            saveData();
        }

        function clearAllData() {
            const confirmed = confirm(t("message.clearConfirm"));

            if (!confirmed) {
                return;
            }

            const currentLang = getLang();

            clearTimeout(saveTimer);
            localStorage.removeItem(STORAGE_KEY);

            appData = clone(DEFAULT_DATA);
            appData.lang = currentLang;

            editingMemberId = null;
            els.detailPage.classList.remove("open");

            render();

            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            els.saveStatus.textContent = t("settings.clearedAndReset");

            clearTimeout(showSaved.timer);
            showSaved.timer = setTimeout(() => {
                els.saveStatus.textContent = t("settings.saveLocal");
            }, 1200);
        }

        els.modeButtons.forEach((button) => {
            button.addEventListener("click", () => {
                appData.mode = button.dataset.mode;
                closeDetail();
                render();
                saveData();
            });
        });

        els.langButtons.forEach((button) => {
            button.addEventListener("click", () => {
                setLanguage(button.dataset.lang);
            });
        });

        els.hatchTarget.addEventListener("input", () => {
            updateTarget("hatch", els.hatchTarget, DEFAULT_DATA.targets.hatch);
        });

        els.farmTarget.addEventListener("input", () => {
            updateTarget("farm", els.farmTarget, DEFAULT_DATA.targets.farm);
        });

        els.goldHatchTarget.addEventListener("input", () => {
            updateTarget("goldHatch", els.goldHatchTarget, DEFAULT_DATA.targets.goldHatch);
        });

        els.goldFarmTarget.addEventListener("input", () => {
            updateTarget("goldFarm", els.goldFarmTarget, DEFAULT_DATA.targets.goldFarm);
        });

        [
            els.selfNameInput,
            els.selfScoreInput,
            els.friendNameInput,
            els.friendScoreInput
        ].forEach((input) => {
            input.addEventListener("input", autoSaveDetail);
        });

        els.closeDetailBtn.addEventListener("click", closeDetail);
        els.detailBackBtn.addEventListener("click", closeDetail);
        els.clearAllBtn.addEventListener("click", clearAllData);

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeDetail();
            }
        });

        window.addEventListener("beforeunload", () => {
            if (editingMemberId) {
                autoSaveDetail();
            }

            clearTimeout(saveTimer);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        });

        async function initApp() {
            await loadLanguage(getLang());
            applyI18n();
            render();
        }

        initApp();
    </script>

</body>

</html>
