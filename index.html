<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin999 夥伴計算機</title>

    <link rel="stylesheet" href="./style.css?v=20261023h">
</head>

<body>
    <main class="app">
        <div class="title-row">
            <select id="languageSelect" class="language-select" aria-label="Language"></select>

            <h1 class="title" id="pageTitle">孵化夥伴</h1>
            <p class="title-credit" data-i18n="app.credit">由Coin999-長長久久 隊伍製作</p>
        </div>

        <section class="settings-card">
            <div class="settings-head">
                <span data-i18n="settings.title">關卡設定</span>
            </div>

            <div class="mode-tabs">
                <button class="mode-btn" type="button" data-mode="hatch" data-i18n="mode.hatch">🥚 孵化</button>
                <button class="mode-btn" type="button" data-mode="farm" data-i18n="mode.farm">🌱 耕種</button>
            </div>

            <div class="mode-tabs">
                <button class="mode-btn gold" type="button" data-mode="goldHatch" data-i18n="mode.goldHatch">
                    🏆 黃金孵化
                </button>

                <button class="mode-btn gold" type="button" data-mode="goldFarm" data-i18n="mode.goldFarm">
                    👑 黃金耕種
                </button>
            </div>

            <div class="field-grid">
                <div class="field">
                    <label for="hatchTarget" data-i18n="target.hatch">孵化每位目標分數</label>
                    <input id="hatchTarget" type="number" min="1" step="1">
                </div>

                <div class="field">
                    <label for="farmTarget" data-i18n="target.farm">耕種每位目標分數</label>
                    <input id="farmTarget" type="number" min="1" step="1">
                </div>

                <div class="field">
                    <label for="goldHatchTarget" data-i18n="target.goldHatch">黃金孵化每位目標分數</label>
                    <input id="goldHatchTarget" type="number" min="1" step="1">
                </div>

                <div class="field">
                    <label for="goldFarmTarget" data-i18n="target.goldFarm">黃金耕種每位目標分數</label>
                    <input id="goldFarmTarget" type="number" min="1" step="1">
                </div>
            </div>
        </section>

        <section class="team-stage">
            <div class="team-row normal" id="teamRow"></div>
        </section>

        <section class="summary">
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-label" data-i18n="summary.totalTarget">總目標分</div>
                    <div class="summary-value" id="teamTarget">0</div>
                </div>

                <div class="summary-item">
                    <div class="summary-label" data-i18n="summary.progress">完成進度</div>
                    <div class="summary-value" id="teamProgress">0%</div>
                </div>
            </div>
        </section>

        <button class="match-open-btn" type="button" id="matchOpenBtn" data-match-i18n="openButton">
            🤝 媒合平台：找人幫忙
        </button>

        <button class="clear-btn" type="button" id="clearAllBtn" data-i18n="button.clearAll">
            重置所有設定
        </button>

        <footer data-i18n="app.footer">© {year} 資料提供 CM大佬群 隊伍｜網頁製作 Coin999-長長久久 隊伍</footer>

    </main>

    <section class="detail-page" id="detailPage">
        <div class="detail-inner">
            <div class="top-bar">
                <button class="back-btn" type="button" id="detailBackBtn">‹</button>
            </div>

            <div class="gold-header">
                <div class="duel-card">
                    <div class="duel-name" id="selfNameView">自己</div>
                    <div class="duel-avatar">🧑</div>
                    <div class="duel-score" id="selfScoreView">0</div>
                </div>

                <div class="gold-title-board" id="detailTitle">關卡</div>

                <div class="duel-card">
                    <div class="duel-name" id="friendNameView">隊友</div>
                    <div class="duel-avatar" id="friendAvatarView">🧢</div>
                    <div class="duel-score" id="friendScoreView">0</div>
                </div>
            </div>

            <div class="creature-stage" id="detailCreatureStage"></div>

            <div class="need-line" id="needLine">還需 0 分才能完成</div>

            <section class="calc-panel">
                <div class="calc-grid score-row">
                    <div class="field">
                        <label for="selfScoreInput" data-i18n="person.selfScore">自己分數</label>
                        <input id="selfScoreInput" type="number" min="0" step="1">
                    </div>

                    <div class="field">
                        <label for="friendScoreInput" data-i18n="person.friendScore">隊友分數</label>
                        <input id="friendScoreInput" type="number" min="0" step="1">
                    </div>
                </div>

                <div class="calc-result-grid">
                    <div class="calc-card">
                        <strong data-i18n="detail.currentTotal">目前總分</strong>
                        <span id="detailTotalScore">0</span>
                    </div>

                    <div class="calc-card">
                        <strong data-i18n="detail.targetScore">目標分數</strong>
                        <span id="detailTargetScore">0</span>
                    </div>

                    <div class="calc-card">
                        <strong data-i18n="detail.remainingWhole">一整顆還差</strong>
                        <span id="detailRemainingScore">0</span>
                    </div>

                    <div class="calc-card">
                        <strong data-i18n="detail.needTokensWhole">一整顆代幣</strong>
                        <span id="detailNeedTokens">0</span>
                    </div>

                    <div class="calc-card">
                        <strong data-i18n="detail.responsibilityScore">責任分還差</strong>
                        <span id="detailResponsibilityScore">0</span>
                    </div>

                    <div class="calc-card">
                        <strong data-i18n="detail.responsibilityTokens">責任分代幣</strong>
                        <span id="detailResponsibilityTokens">0</span>
                    </div>
                </div>

                <div class="detail-actions">
                    <button class="close-detail-btn" type="button" id="closeDetailBtn" data-i18n="button.back">
                        返回
                    </button>
                </div>
            </section>

            <footer data-i18n="app.footer">© {year} 資料提供 CM大佬群 隊伍｜網頁製作 Coin999-長長久久 隊伍</footer>
        </div>
    </section>

    <section class="detail-page match-page" id="matchPage">
        <div class="detail-inner">
            <div class="top-bar">
                <button class="back-btn" type="button" id="matchBackBtn" aria-label="Back">‹</button>
            </div>

            <h2 class="match-title" data-match-i18n="title">媒合平台</h2>
            <p class="match-intro" data-match-i18n="intro"></p>

            <section class="settings-card match-form-card">
                <div class="settings-head">
                    <span data-match-i18n="form.title">我要找人幫忙</span>
                </div>

                <form class="match-form" id="matchForm" novalidate>
                    <div class="field">
                        <label for="matchMode" data-match-i18n="form.mode">模式</label>
                        <select id="matchMode" class="match-input"></select>
                    </div>

                    <div class="field">
                        <label for="matchTeam" data-match-i18n="form.team">暱稱</label>
                        <input id="matchTeam" type="text" maxlength="20" autocomplete="off" data-match-i18n-placeholder="form.teamPlaceholder">
                    </div>

                    <div class="field">
                        <label for="matchLink" data-match-i18n="form.link">遊戲交友連結</label>
                        <input id="matchLink" type="url" maxlength="300" autocomplete="off" placeholder="https://">
                    </div>

                    <div class="field">
                        <label for="matchTokens" data-match-i18n="form.tokens">目前代幣</label>
                        <input id="matchTokens" type="number" min="0" step="1" inputmode="numeric">
                    </div>

                    <div class="field">
                        <span class="match-field-label" data-match-i18n="form.done">已完成幾隻</span>
                        <div class="match-done-picker" id="matchDonePicker" role="group"></div>
                        <p class="match-done-hint" id="matchDoneHint"></p>
                    </div>

                    <p class="match-rule" id="matchRule"></p>
                    <p class="match-form-msg" id="matchFormMsg" role="status"></p>

                    <button class="match-submit-btn" type="submit" id="matchSubmit">送出</button>
                </form>
            </section>

            <div class="match-list-head">
                <span data-match-i18n="listTitle">徵求列表</span>
                <button class="match-refresh-btn" type="button" id="matchRefresh" data-match-i18n="refresh">重新整理</button>
            </div>

            <div class="match-filter" id="matchFilter"></div>
            <p class="match-notice" id="matchNotice" hidden></p>
            <div class="match-progress" id="matchProgress" hidden></div>
            <div class="match-list" id="matchList"></div>

            <footer data-i18n="app.footer">© {year} 資料提供 CM大佬群 隊伍｜網頁製作 Coin999-長長久久 隊伍</footer>
        </div>
    </section>

    <div class="match-toast" id="matchToast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js?v=20261023h"></script>
</body>

</html>
