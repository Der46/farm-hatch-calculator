<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin999 夥伴計算機</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="app">
        <div class="title-row">
            <h1 class="title" id="pageTitle">孵化夥伴</h1>

            <select id="languageSelect" class="language-select" aria-label="Language"></select>
        </div>

        <section class="settings-card">
            <div class="settings-head">
                <span data-i18n="settings.title">關卡設定</span>
                <span id="saveStatus" data-i18n="settings.saveLocal">資料保存在本機</span>
            </div>

            <div class="timezone-line" id="timezoneLine">UTC+08:00</div>

            <div class="mode-tabs">
                <button class="mode-btn" type="button" data-mode="hatch" data-i18n="mode.hatch">🥚 孵化</button>
                <button class="mode-btn" type="button" data-mode="farm" data-i18n="mode.farm">🌱 耕種</button>
            </div>

            <div class="mode-tabs">
                <button class="mode-btn gold" type="button" data-mode="goldHatch" data-i18n="mode.goldHatch">
                    🏆 黃金孵化
                </button>

                <button class="mode-btn gold" type="button" data-mode="goldFarm" data-i18n="mode.goldFarm">
                    👑 黃金耕種
                </button>
            </div>

            <div class="field-grid">
                <div class="field">
                    <label for="hatchTarget" data-i18n="target.hatch">孵化每位目標分數</label>
                    <input id="hatchTarget" type="number" min="1" step="1">
                </div>

                <div class="field">
                    <label for="farmTarget" data-i18n="target.farm">耕種每位目標分數</label>
                    <input id="farmTarget" type="number" min="1" step="1">
                </div>

                <div class="field">
                    <label for="goldHatchTarget" data-i18n="target.goldHatch">黃金孵化每位目標分數</label>
                    <input id="goldHatchTarget" type="number" min="1" step="1">
                </div>

                <div class="field">
                    <label for="goldFarmTarget" data-i18n="target.goldFarm">黃金耕種每位目標分數</label>
                    <input id="goldFarmTarget" type="number" min="1" step="1">
                </div>
            </div>
        </section>

        <section class="team-stage">
            <div class="team-row normal" id="teamRow"></div>
        </section>

        <section class="summary">
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-label" data-i18n="summary.totalTarget">總目標分</div>
                    <div class="summary-value" id="teamTarget">0</div>
                </div>

                <div class="summary-item">
                    <div class="summary-label" data-i18n="summary.progress">完成進度</div>
                    <div class="summary-value" id="teamProgress">0%</div>
                </div>
            </div>
        </section>

        <button class="clear-btn" type="button" id="clearAllBtn" data-i18n="button.clearAll">
            清除全部本機資料
        </button>

        <footer data-i18n="app.footer">© Coin999-長長久久 隊伍</footer>
    </main>

    <section class="detail-page" id="detailPage">
        <div class="detail-inner">
            <div class="top-bar">
                <button class="back-btn" type="button" id="detailBackBtn">‹</button>
            </div>

            <div class="gold-header">
                <div class="duel-card">
                    <div class="duel-name" id="selfNameView">自己</div>
                    <div class="duel-avatar">🧑</div>
                    <div class="duel-score" id="selfScoreView">0</div>
                </div>

                <div class="gold-title-board" id="detailTitle">關卡</div>

                <div class="duel-card">
                    <div class="duel-name" id="friendNameView">隊友</div>
                    <div class="duel-avatar" id="friendAvatarView">🧢</div>
                    <div class="duel-score" id="friendScoreView">0</div>
                </div>
            </div>

            <div class="creature-stage" id="detailCreatureStage"></div>

            <div class="need-line" id="needLine">還需 0 分才能完成</div>

            <section class="calc-panel">
                <div class="calc-grid score-row">
                    <div class="field">
                        <label for="selfScoreInput" data-i18n="person.selfScore">自己分數</label>
                        <input id="selfScoreInput" type="number" min="0" step="1">
                    </div>

                    <div class="field">
                        <label for="friendScoreInput" data-i18n="person.friendScore">隊友分數</label>
                        <input id="friendScoreInput" type="number" min="0" step="1">
                    </div>
                </div>

                <div class="calc-result-grid">
                    <div class="calc-card">
                        <strong data-i18n="detail.currentTotal">目前總分</strong>
                        <span id="detailTotalScore">0</span>
                    </div>

                    <div class="calc-card">
                        <strong data-i18n="detail.targetScore">目標分數</strong>
                        <span id="detailTargetScore">0</span>
                    </div>

                    <div class="calc-card">
                        <strong data-i18n="detail.remainingWhole">一整顆還差</strong>
                        <span id="detailRemainingScore">0</span>
                    </div>

                    <div class="calc-card">
                        <strong data-i18n="detail.needTokensWhole">一整顆代幣</strong>
                        <span id="detailNeedTokens">0</span>
                    </div>

                    <div class="calc-card">
                        <strong data-i18n="detail.responsibilityScore">責任分還差</strong>
                        <span id="detailResponsibilityScore">0</span>
                    </div>

                    <div class="calc-card">
                        <strong data-i18n="detail.responsibilityTokens">責任分代幣</strong>
                        <span id="detailResponsibilityTokens">0</span>
                    </div>
                </div>

                <div class="detail-actions">
                    <button class="close-detail-btn" type="button" id="closeDetailBtn" data-i18n="button.back">
                        返回
                    </button>
                </div>
            </section>

            <footer data-i18n="app.footer">© Coin999-長長久久 隊伍</footer>
        </div>
    </section>

    <script type="module" src="./app.js"></script>
</body>

</html>
